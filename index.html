it:"abend",dauer_min:10,braucht_beweis:!1,tags:["erinnerung"]},{id:"ch1-011",text:"K\xFCss sie heute an einer Stelle, an der du sie sonst nie k\xFCsst.",stufe:1,intensitaet:2,kontext:"zusammen",tageszeit:"egal",dauer_min:null,braucht_beweis:!1,tags:["kuessen","neu"]},{id:"ch1-012",text:"Halte heute beim Einschlafen ihre Hand. Die ganze Zeit bis du wegd\xF6st.",stufe:1,intensitaet:1,kontext:"zusammen",tageszeit:"nacht",dauer_min:null,braucht_beweis:!1,tags:["naehe"]},{id:"ch1-013",text:"Frag sie heute nach einer Sache, die sie schon immer mal ausprobieren wollte. Und h\xF6r wirklich zu.",stufe:1,intensitaet:2,kontext:"zusammen",tageszeit:"abend",dauer_min:15,braucht_beweis:!1,tags:["reden"]},{id:"ch1-014",text:"Sag ihr heute einmal ganz direkt was du gerade an ihr willst. Ohne drumherum zu reden.",stufe:1,intensitaet:2,kontext:"egal",tageszeit:"egal",dauer_min:2,braucht_beweis:!1,tags:["direktheit"]},{id:"ch1-015",text:"R\xE4um heute etwas auf, das sonst immer sie macht. Ohne es zu erw\xE4hnen.",stufe:1,intensitaet:1,kontext:"zusammen",tageszeit:"egal",dauer_min:null,braucht_beweis:!1,tags:["alltag","dienen"]},{id:"ch2-001",text:"Schick ihr ein Foto von dir, auf dem du weniger anhast als heute Morgen.",stufe:2,intensitaet:2,kontext:"getrennt",tageszeit:"tag",dauer_min:5,braucht_beweis:!0,tags:["foto"]},{id:"ch2-002",text:"Zieh dich heute Abend vor ihr aus. Langsam. Sie sagt dir wann du weitermachen darfst.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"abend",dauer_min:10,braucht_beweis:!1,tags:["strip"]},{id:"ch2-003",text:"Schreib ihr eine Nachricht die beschreibt, was du heute Abend mit ihr machen willst. Detailliert.",stufe:2,intensitaet:3,kontext:"getrennt",tageszeit:"tag",dauer_min:10,braucht_beweis:!0,tags:["dirtytalk"]},{id:"ch2-004",text:"K\xFCss dich heute Abend von ihrem Hals bis zu ihren F\xFC\xDFen. Lass keine Stelle aus.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"abend",dauer_min:15,braucht_beweis:!1,tags:["kuessen"]},{id:"ch2-005",text:"Massiere sie heute komplett. Mit \xD6l. Sie muss keinen Finger r\xFChren.",stufe:2,intensitaet:2,kontext:"zusammen",tageszeit:"abend",dauer_min:30,braucht_beweis:!1,tags:["massage","dienen"]},{id:"ch2-006",text:"Trag heute keine Unterw\xE4sche. Sie darf jederzeit kontrollieren.",stufe:2,intensitaet:3,kontext:"egal",tageszeit:"morgen",dauer_min:null,braucht_beweis:!1,tags:["kleidung","geheim"]},{id:"ch2-007",text:"Duscht heute zusammen. Du w\xE4schst sie komplett.",stufe:2,intensitaet:2,kontext:"zusammen",tageszeit:"abend",dauer_min:20,braucht_beweis:!1,tags:["dusche","dienen"]},{id:"ch2-008",text:"Schick ihr eine Sprachnachricht, in der du ihr sagst was du gerade denkst. Ungefiltert.",stufe:2,intensitaet:3,kontext:"getrennt",tageszeit:"egal",dauer_min:3,braucht_beweis:!0,tags:["voice"]},{id:"ch2-009",text:"Fass sie heute Abend an, w\xE4hrend wir einen Film schauen. Unauff\xE4llig. Der Film l\xE4uft weiter.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"abend",dauer_min:45,braucht_beweis:!1,tags:["subtil"]},{id:"ch2-010",text:"Zieh ihr heute Abend die Schuhe aus und massiere ihre F\xFC\xDFe. Zehn Minuten.",stufe:2,intensitaet:2,kontext:"zusammen",tageszeit:"abend",dauer_min:10,braucht_beweis:!1,tags:["fuesse","dienen"]},{id:"ch2-011",text:"Wecke sie heute nicht mit Worten, sondern mit deinen H\xE4nden.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"morgen",dauer_min:10,braucht_beweis:!1,tags:["morgen"]},{id:"ch2-012",text:"Sag ihr heute mindestens einmal, ganz direkt, was du dir von ihr w\xFCnschst. Mit klaren Worten.",stufe:2,intensitaet:3,kontext:"egal",tageszeit:"egal",dauer_min:2,braucht_beweis:!1,tags:["worte","mut"]},{id:"ch2-013",text:"Zieh heute Abend an, was sie dir raussucht. Egal was.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"abend",dauer_min:null,braucht_beweis:!1,tags:["kontrolle","kleidung"]},{id:"ch2-014",text:"Schreib ihr auf, welche Fantasie du gerade am h\xE4ufigsten hast. Schick es ab, ohne nochmal zu lesen.",stufe:2,intensitaet:3,kontext:"egal",tageszeit:"egal",dauer_min:10,braucht_beweis:!0,tags:["offenheit","fantasie"]},{id:"ch2-015",text:"K\xFCss sie heute so, wie beim allerersten Mal. Und dann noch besser.",stufe:2,intensitaet:2,kontext:"zusammen",tageszeit:"egal",dauer_min:5,braucht_beweis:!1,tags:["kuessen"]},{id:"ch2-016",text:"Zieh dich vor dem Schlafengehen komplett aus und schlaf so ein \u2014 auch wenn nichts passiert.",stufe:2,intensitaet:2,kontext:"zusammen",tageszeit:"nacht",dauer_min:null,braucht_beweis:!1,tags:["nackt","naehe"]},{id:"ch2-017",text:"Frag sie heute h\xF6flich um Erlaubnis, bevor du sie anfasst. Bei jeder Ber\xFChrung.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"abend",dauer_min:180,braucht_beweis:!1,tags:["protokoll"]},{id:"ch2-018",text:"Sag ihr heute den ganzen Tag \xFCber 'Ja' zu allem was sie will. Ohne Diskussion.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"egal",dauer_min:null,braucht_beweis:!1,tags:["gehorsam"]},{id:"ch3-001",text:"Du machst sie heute Abend mit dem Mund fertig \u2014 und bekommst selbst nichts.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"abend",dauer_min:25,braucht_beweis:!1,tags:["oral","dienen"]},{id:"ch3-002",text:"Fass dich heute an, aber komm nicht. Sie fragt heute Abend nach.",stufe:3,intensitaet:4,kontext:"egal",tageszeit:"tag",dauer_min:15,braucht_beweis:!1,tags:["edging","denial"]},{id:"ch3-003",text:"Knie dich heute Abend vor sie hin und warte, bis sie dir sagt was passiert.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"abend",dauer_min:10,braucht_beweis:!1,tags:["knien","warten"]},{id:"ch3-004",text:"Schick ihr ein Foto von dir, das du sonst niemandem zeigen w\xFCrdest.",stufe:3,intensitaet:4,kontext:"getrennt",tageszeit:"egal",dauer_min:5,braucht_beweis:!0,tags:["foto","mut"]},{id:"ch3-005",text:"Sie bestimmt heute Abend alles. Was du machst, wann du aufh\xF6rst, ob du \xFCberhaupt etwas bekommst.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"abend",dauer_min:null,braucht_beweis:!1,tags:["kontrolle"]},{id:"ch3-006",text:"Du darfst heute nicht kommen. Sie schon. So oft sie will.",stufe:3,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:null,braucht_beweis:!1,tags:["denial"]},{id:"ch3-007",text:"Mach es dir selbst, w\xE4hrend sie zuschaut. Sie sagt dir wann du aufh\xF6rst.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"abend",dauer_min:15,braucht_beweis:!1,tags:["masturbation","kontrolle"]},{id:"ch3-008",text:"Zwei Runden heute. Zwischen den Runden eine Stunde Pause.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"abend",dauer_min:null,braucht_beweis:!1,tags:["training","ausdauer"]},{id:"ch3-009",text:"Sie legt dir heute eine Regel fest, die den ganzen Tag gilt. Du h\xE4ltst dich dran.",stufe:3,intensitaet:4,kontext:"egal",tageszeit:"morgen",dauer_min:null,braucht_beweis:!1,tags:["regel","gehorsam"]},{id:"ch3-010",text:"Du h\xE4ltst heute Abend mindestens f\xFCnfzehn Minuten durch. Schaffst du es nicht, wird morgen doppelt trainiert.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"abend",dauer_min:15,braucht_beweis:!1,tags:["ausdauer","training"]},{id:"ch3-011",text:"Schreib ihr w\xE4hrend sie arbeitet genau auf, was du heute Abend mit ihr machen wirst. Jedes Detail.",stufe:3,intensitaet:4,kontext:"getrennt",tageszeit:"tag",dauer_min:15,braucht_beweis:!0,tags:["dirtytalk","vorfreude"]},{id:"ch3-012",text:"Sie zieht dich heute an. Komplett. Auch die Unterw\xE4sche.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"morgen",dauer_min:10,braucht_beweis:!1,tags:["kontrolle","kleidung"]},{id:"ch3-013",text:"Heute Abend keine H\xE4nde f\xFCr dich. Nur sie bestimmt wie viel du bekommst.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"abend",dauer_min:null,braucht_beweis:!1,tags:["kontrolle","einschraenkung"]},{id:"ch3-014",text:"Sprich sie heute den ganzen Tag mit dem Titel an, den sie sich aussucht.",stufe:3,intensitaet:4,kontext:"egal",tageszeit:"morgen",dauer_min:null,braucht_beweis:!1,tags:["protokoll"]},{id:"ch3-015",text:"Melde dich heute jede Stunde bei ihr per Nachricht. Egal was du gerade machst.",stufe:3,intensitaet:3,kontext:"getrennt",tageszeit:"tag",dauer_min:480,braucht_beweis:!0,tags:["kontrolle","meldung"]},{id:"ch3-016",text:"Sie fesselt dich heute Abend. Was danach passiert, entscheidet sie.",stufe:3,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:45,braucht_beweis:!1,tags:["bondage"]},{id:"ch3-017",text:"Du gehst heute Abend runter und bleibst da, bis sie zweimal gekommen ist.",stufe:3,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:35,braucht_beweis:!1,tags:["oral","ausdauer"]},{id:"ch3-018",text:"Sie f\xE4hrt dich heute Abend dreimal an die Kante und stoppt jedes Mal. Beim dritten Mal entscheidet sie spontan.",stufe:3,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:40,braucht_beweis:!1,tags:["edging"]},{id:"ch3-019",text:"Trag heute den ganzen Tag etwas von ihr unter deiner Kleidung. Niemand darf es merken.",stufe:3,intensitaet:4,kontext:"egal",tageszeit:"morgen",dauer_min:480,braucht_beweis:!0,tags:["geheim","kleidung"]},{id:"ch3-020",text:"Heute Abend geh\xF6rt der erste Orgasmus ihr. Und der zweite auch. Erst dann bist du dran.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"abend",dauer_min:60,braucht_beweis:!1,tags:["reihenfolge","dienen"]},{id:"ch4-001",text:"Du bekommst heute keinen Orgasmus. Und morgen auch nicht. Sie sagt dir wann wieder.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"egal",dauer_min:null,braucht_beweis:!1,tags:["denial","lang"]},{id:"ch4-002",text:"Sie benutzt dich heute Abend. Du liegst still und sagst danke.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:30,braucht_beweis:!1,tags:["benutzen","hingabe"]},{id:"ch4-003",text:"F\xFCnfmal Edging heute Abend. Beim sechsten Mal entscheidet sie per M\xFCnzwurf.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:50,braucht_beweis:!1,tags:["edging","zufall"]},{id:"ch4-004",text:"Trag heute den ganzen Abend was sie dir reinsteckt. Auch beim Abendessen.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:180,braucht_beweis:!1,tags:["plug","dauer"]},{id:"ch4-005",text:"Sie fesselt dich, verbindet dir die Augen und l\xE4sst dich zwanzig Minuten allein.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:20,braucht_beweis:!1,tags:["bondage","warten"]},{id:"ch4-006",text:"Drei Runden heute. Zwischen jeder Runde f\xFCnfzehn Minuten Pause. Du machst alle drei mit.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:120,braucht_beweis:!1,tags:["training","ausdauer"]},{id:"ch4-007",text:"Sie macht es sich heute Abend selbst, direkt vor dir. Du darfst nur zuschauen.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:25,braucht_beweis:!1,tags:["zuschauen","denial"]},{id:"ch4-008",text:"Du bettelst heute Abend um jeden einzelnen Schritt. \xDCberzeugend. Sonst passiert nichts.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:40,braucht_beweis:!1,tags:["betteln"]},{id:"ch4-009",text:"Ein ganzer Tag unter ihrer Kontrolle. Was du isst, was du anziehst, wann du schl\xE4fst.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"morgen",dauer_min:null,braucht_beweis:!1,tags:["totalkontrolle"]},{id:"ch4-010",text:"Sie fickt dich heute Abend mit dem Strapon. Du bereitest alles selbst vor.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:40,braucht_beweis:!1,tags:["pegging"]},{id:"ch4-011",text:"Zwei Orgasmen hintereinander. Ohne Pause. Auch wenn du bettelst dass sie aufh\xF6rt.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:40,braucht_beweis:!1,tags:["overstimulation"]},{id:"ch4-012",text:"Halsband heute Abend. Den ganzen Abend. Auch wenn wir nur auf dem Sofa sitzen.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:180,braucht_beweis:!1,tags:["ds","protokoll"]},{id:"ch4-013",text:"Sie schreibt dir etwas auf die Haut. Das bleibt bis morgen fr\xFCh drauf.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:null,braucht_beweis:!0,tags:["markierung"]},{id:"ch4-014",text:"Sie schickt dir heute alle zwanzig Minuten eine Anweisung. Du befolgst jede einzelne.",stufe:4,intensitaet:5,kontext:"getrennt",tageszeit:"tag",dauer_min:240,braucht_beweis:!0,tags:["fernsteuerung"]},{id:"ch4-015",text:"Eine Stunde Edging heute Abend. Danach entscheidet das Rad ob du darfst.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:60,braucht_beweis:!1,tags:["edging","zufall"]},{id:"ch4-016",text:"Sie kontrolliert heute das Toy per Fernbedienung. Den ganzen Abend. Egal wo wir sind.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:240,braucht_beweis:!1,tags:["remote","kontrolle"]},{id:"ch4-017",text:"Du machst sie heute Abend dreimal fertig, bevor du \xFCberhaupt drankommst.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:60,braucht_beweis:!1,tags:["dienen","ausdauer"]},{id:"ch4-018",text:"Kein Blickkontakt heute Abend ohne ihre Erlaubnis. Kein einziges Mal.",stufe:4,intensitaet:4,kontext:"zusammen",tageszeit:"abend",dauer_min:180,braucht_beweis:!1,tags:["protokoll"]},{id:"ch5-001",text:"Heute geh\xF6rst du ihr komplett. Sie macht mit dir was sie will, du sagst nur Ja.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"egal",dauer_min:null,braucht_beweis:!1,tags:["hingabe","totalkontrolle"]},{id:"ch5-002",text:"Eine Woche kein Orgasmus. Ab heute. Sie z\xE4hlt mit.",stufe:5,intensitaet:5,kontext:"egal",tageszeit:"morgen",dauer_min:10080,braucht_beweis:!1,tags:["denial","langzeit"]},{id:"ch5-003",text:"Vier Runden heute. Sie h\xF6rt nicht auf, bis du nicht mehr kannst \u2014 und dann noch einmal.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:180,braucht_beweis:!1,tags:["ausdauer","limit"]},{id:"ch5-004",text:"Gefesselt, Augen verbunden, geknebelt. Eine Stunde. Du wei\xDFt nicht was passiert.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:60,braucht_beweis:!1,tags:["bondage","sensorisch"]},{id:"ch5-005",text:"Zehnmal an die Kante heute Abend. Erst beim zehnten Mal darfst du \u2014 vielleicht.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:90,braucht_beweis:!1,tags:["edging","extrem"]},{id:"ch5-006",text:"Sie entscheidet heute, wie oft du kannst. Und dann macht sie eins mehr.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:120,braucht_beweis:!1,tags:["overstimulation","training"]},{id:"ch5-007",text:"Du kniest, wenn sie den Raum betritt. Den ganzen Tag. Jedes Mal.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"morgen",dauer_min:null,braucht_beweis:!1,tags:["protokoll","knien"]},{id:"ch5-008",text:"Sie schreibt heute Morgen auf, was am Abend passieren wird. Du liest es erst danach.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"morgen",dauer_min:null,braucht_beweis:!1,tags:["ungewiss","geheim"]},{id:"ch5-009",text:"Ein ganzes Wochenende unter ihren Regeln. Ab jetzt bis Sonntagabend.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"egal",dauer_min:2880,braucht_beweis:!1,tags:["langzeit","totalkontrolle"]},{id:"ch5-010",text:"Sie sitzt heute Abend auf deinem Gesicht, bis sie fertig ist. So oft sie will.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:45,braucht_beweis:!1,tags:["facesitting","ausdauer"]},{id:"ch5-011",text:"Du machst dich heute selbst fertig \u2014 dreimal. Und meldest jedes Mal.",stufe:5,intensitaet:5,kontext:"getrennt",tageszeit:"egal",dauer_min:null,braucht_beweis:!0,tags:["training","frequenz"]},{id:"ch5-012",text:"Heute darfst du nichts entscheiden. Nichts. Sie sagt dir jeden Schritt an.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"morgen",dauer_min:null,braucht_beweis:!1,tags:["totalkontrolle"]},{id:"ch5-013",text:"Sie bringt dich heute Abend an dein Limit. Und dann etwas dar\xFCber hinaus.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:90,braucht_beweis:!1,tags:["limit","intensiv"]},{id:"ch5-014",text:"Morgens, mittags, abends. Heute dreimal. Alle drei Male vollst\xE4ndig.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"morgen",dauer_min:null,braucht_beweis:!1,tags:["frequenz","training"]},{id:"ch5-015",text:"Sie sucht heute drei Karten aus drei verschiedenen Decks aus. Alle drei werden gemacht.",stufe:5,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:120,braucht_beweis:!1,tags:["kombination","meta"]}],challengePools:{wochenende:[{id:"we-001",text:"Bleibt heute bis Mittag im Bett. Nichts anderes ist erlaubt.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"morgen",dauer_min:300,braucht_beweis:!1,tags:["wochenende","auszeit"]},{id:"we-002",text:"Heute macht ihr eine Sache von der Bucket-List. Sie sucht aus.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"egal",dauer_min:null,braucht_beweis:!1,tags:["wochenende","bucketlist"]},{id:"we-003",text:"Ein ganzer Tag ohne Kleidung. Wohnung, Vorh\xE4nge zu, kein Besuch.",stufe:3,intensitaet:3,kontext:"zusammen",tageszeit:"morgen",dauer_min:null,braucht_beweis:!1,tags:["wochenende","nackt"]},{id:"we-004",text:"Drehen wir heute dreimal am Rad. Alle drei Ergebnisse werden umgesetzt.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"egal",dauer_min:null,braucht_beweis:!1,tags:["wochenende","rad"]},{id:"we-005",text:"Heute Abend ein Date wie beim ersten Mal. Danach das was danach kam.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"abend",dauer_min:null,braucht_beweis:!1,tags:["wochenende","romantik"]},{id:"we-006",text:"Neuer Ort heute. Nicht das Schlafzimmer, nicht das Sofa. Sie sucht aus.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"egal",dauer_min:null,braucht_beweis:!1,tags:["wochenende","ort"]},{id:"we-007",text:"Ein kompletter Verw\xF6hn-Tag f\xFCr sie. Du dienst, sie liegt rum.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"morgen",dauer_min:null,braucht_beweis:!1,tags:["wochenende","dienen"]}],getrennt:[{id:"tr-001",text:"Videoanruf heute Abend. Sie sagt dir was du machst.",stufe:3,intensitaet:4,kontext:"getrennt",tageszeit:"abend",dauer_min:25,braucht_beweis:!1,tags:["video","distanz"]},{id:"tr-002",text:"Schreibt zusammen eine Fantasie. Abwechselnd, ein Satz pro Person, bis sie fertig ist.",stufe:2,intensitaet:3,kontext:"getrennt",tageszeit:"abend",dauer_min:30,braucht_beweis:!0,tags:["schreiben","distanz"]},{id:"tr-003",text:"Du fasst dich an, w\xE4hrend sie dir schreibt was du machen sollst. Aber du kommst nicht.",stufe:4,intensitaet:5,kontext:"getrennt",tageszeit:"abend",dauer_min:25,braucht_beweis:!1,tags:["denial","fernsteuerung"]},{id:"tr-004",text:"Schick ihr heute drei Fotos \xFCber den Tag verteilt. Jedes gewagter als das vorherige.",stufe:3,intensitaet:4,kontext:"getrennt",tageszeit:"tag",dauer_min:null,braucht_beweis:!0,tags:["foto","eskalation"]},{id:"tr-005",text:"Sprachnachricht: Erz\xE4hl ihr in Ruhe, was du gerade machen w\xFCrdest wenn sie da w\xE4re. Alles.",stufe:3,intensitaet:4,kontext:"getrennt",tageszeit:"egal",dauer_min:5,braucht_beweis:!0,tags:["voice","fantasie"]},{id:"tr-006",text:"Du fasst dich heute gar nicht an. Sie fragt morgen nach \u2014 und sie merkt wenn du l\xFCgst.",stufe:4,intensitaet:4,kontext:"getrennt",tageszeit:"morgen",dauer_min:1440,braucht_beweis:!1,tags:["denial","vertrauen"]}],ruhig:[{id:"ru-001",text:"Heute nur kuscheln. Zwei Stunden. Nichts anderes.",stufe:1,intensitaet:1,kontext:"zusammen",tageszeit:"abend",dauer_min:120,braucht_beweis:!1,tags:["ruhe","naehe"]},{id:"ru-002",text:"Massiere ihr heute den R\xFCcken, bis sie einschl\xE4ft.",stufe:1,intensitaet:1,kontext:"zusammen",tageszeit:"nacht",dauer_min:25,braucht_beweis:!1,tags:["ruhe","massage"]},{id:"ru-003",text:"Redet heute Abend eine halbe Stunde \xFCber etwas, wor\xFCber ihr sonst nicht redet.",stufe:1,intensitaet:1,kontext:"zusammen",tageszeit:"abend",dauer_min:30,braucht_beweis:!1,tags:["ruhe","reden"]},{id:"ru-004",text:"Bad zusammen. Sonst nichts.",stufe:1,intensitaet:1,kontext:"zusammen",tageszeit:"abend",dauer_min:45,braucht_beweis:!1,tags:["ruhe","bad"]},{id:"ru-005",text:"Heute nichts. Kein Training, keine Aufgabe, keine Regel. Einfach nur wir beide.",stufe:1,intensitaet:1,kontext:"zusammen",tageszeit:"egal",dauer_min:null,braucht_beweis:!1,tags:["ruhe","pause"]},{id:"ru-006",text:"Schlaft heute fr\xFCh. Zusammen. Ohne dass etwas passiert.",stufe:1,intensitaet:1,kontext:"zusammen",tageszeit:"nacht",dauer_min:null,braucht_beweis:!1,tags:["ruhe","schlaf"]}],domme:[{id:"dom-001",text:"Sag ihm heute einmal ganz konkret, was du an ihm gut findest. Nicht allgemein \u2014 spezifisch.",stufe:1,intensitaet:1,kontext:"egal",tageszeit:"egal",dauer_min:2,braucht_beweis:!1,tags:["domme","worte"]},{id:"dom-002",text:"Leg ihm heute Morgen seine Kleidung raus. Er tr\xE4gt genau das.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"morgen",dauer_min:5,braucht_beweis:!1,tags:["domme","kontrolle"]},{id:"dom-003",text:"Schick ihm mitten am Tag eine Anweisung. Ohne Vorwarnung, ohne Erkl\xE4rung.",stufe:2,intensitaet:3,kontext:"getrennt",tageszeit:"tag",dauer_min:2,braucht_beweis:!1,tags:["domme","spontan"]},{id:"dom-004",text:"Setz heute eine neue Regel. Sag ihm nicht welche \u2014 er muss selbst nachschauen.",stufe:3,intensitaet:4,kontext:"egal",tageszeit:"egal",dauer_min:5,braucht_beweis:!1,tags:["domme","regel"]},{id:"dom-005",text:"Belohne ihn heute f\xFCr etwas, das er letzte Woche gut gemacht hat. Er wei\xDF nicht wof\xFCr.",stufe:2,intensitaet:3,kontext:"zusammen",tageszeit:"abend",dauer_min:null,braucht_beweis:!1,tags:["domme","belohnung"]},{id:"dom-006",text:"Plane heute einen geheimen Auftrag f\xFCr n\xE4chste Woche. Er sieht nur den Countdown.",stufe:3,intensitaet:4,kontext:"egal",tageszeit:"egal",dauer_min:10,braucht_beweis:!1,tags:["domme","geheim"]},{id:"dom-007",text:"Frag ihn heute Abend, wie es ihm mit allem geht. Richtig fragen, richtig zuh\xF6ren.",stufe:1,intensitaet:1,kontext:"zusammen",tageszeit:"abend",dauer_min:20,braucht_beweis:!1,tags:["domme","checkin"]},{id:"dom-008",text:"Nimm dir heute etwas, ohne zu fragen. Er soll merken dass du es kannst.",stufe:3,intensitaet:4,kontext:"zusammen",tageszeit:"egal",dauer_min:null,braucht_beweis:!1,tags:["domme","dominanz"]},{id:"dom-009",text:"Erh\xF6he heute sein Ziel f\xFCr diese Woche. Sag ihm die neue Zahl.",stufe:3,intensitaet:4,kontext:"egal",tageszeit:"egal",dauer_min:5,braucht_beweis:!1,tags:["domme","training"]},{id:"dom-010",text:"Lass ihn heute etwas machen, was er noch nie gemacht hat. Du entscheidest was.",stufe:4,intensitaet:5,kontext:"zusammen",tageszeit:"abend",dauer_min:null,braucht_beweis:!1,tags:["domme","neu"]}]},kekse:[{id:"fc-r001",text:"Heute ist wieder so ein Tag, an dem du sie ansiehst und nicht glauben kannst, dass sie deine ist.",kategorie:"romantisch",fuer:"sub",intensitaet:1,tageszeit:"morgen"},{id:"fc-r002",text:"Sag ihr heute etwas, das du sonst nur denkst.",kategorie:"romantisch",fuer:"beide",intensitaet:1,tageszeit:"egal"},{id:"fc-r003",text:"Die besten N\xE4chte fangen mit einem Blick an, der zu lange dauert.",kategorie:"romantisch",fuer:"beide",intensitaet:2,tageszeit:"abend"},{id:"fc-r004",text:"Jemand denkt gerade an dich. Und nicht auf die harmlose Art.",kategorie:"romantisch",fuer:"beide",intensitaet:3,tageszeit:"egal"},{id:"fc-r005",text:"Manche Menschen sucht man ein Leben lang. Wir haben schon gefunden.",kategorie:"romantisch",fuer:"beide",intensitaet:1,tageszeit:"egal"},{id:"fc-r006",text:"K\xFCss sie heute, bevor du irgendetwas sagst.",kategorie:"romantisch",fuer:"sub",intensitaet:1,tageszeit:"morgen"},{id:"fc-r007",text:"Zwischen uns ist mehr los als die meisten je erleben werden.",kategorie:"romantisch",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-r008",text:"Der Moment, in dem sie lacht und du vergisst was du sagen wolltest \u2014 den hast du heute noch vor dir.",kategorie:"romantisch",fuer:"sub",intensitaet:1,tageszeit:"morgen"},{id:"fc-r009",text:"Was wir haben, kann man sich nicht ausdenken.",kategorie:"romantisch",fuer:"beide",intensitaet:1,tageszeit:"egal"},{id:"fc-r010",text:"Heute Abend: keine Ablenkung. Nur wir zwei.",kategorie:"romantisch",fuer:"beide",intensitaet:1,tageszeit:"abend"},{id:"fc-r011",text:"Du hast jemanden gefunden, der dich kennt und trotzdem bleibt. Das ist selten.",kategorie:"romantisch",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-r012",text:"Ber\xFChr sie heute einmal ohne Grund. Nur weil du kannst.",kategorie:"romantisch",fuer:"sub",intensitaet:1,tageszeit:"egal"},{id:"fc-d001",text:"Sie denkt heute schon den ganzen Morgen an gestern Abend. Und du auch.",kategorie:"dreckig",fuer:"sub",intensitaet:3,tageszeit:"morgen"},{id:"fc-d002",text:"Es gibt Tage, an denen Reden \xFCberbewertet ist.",kategorie:"dreckig",fuer:"beide",intensitaet:3,tageszeit:"abend"},{id:"fc-d003",text:"Heute Abend wird nichts diskutiert.",kategorie:"dreckig",fuer:"sub",intensitaet:4,tageszeit:"abend"},{id:"fc-d004",text:"Du hast heute etwas gut. Frag sie, ob sie es dir gibt.",kategorie:"dreckig",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-d005",text:"Der Abstand zwischen 'nur kurz' und 'zwei Stunden sp\xE4ter' war noch nie so klein.",kategorie:"dreckig",fuer:"beide",intensitaet:3,tageszeit:"abend"},{id:"fc-d006",text:"Manche Dinge macht man nicht, weil man muss. Sondern weil sie es sagt.",kategorie:"dreckig",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-d007",text:"Heute w\xE4re ein guter Tag, um sie sprachlos zu machen.",kategorie:"dreckig",fuer:"sub",intensitaet:4,tageszeit:"abend"},{id:"fc-d008",text:"Du wirst heute Abend nicht viel zu sagen haben. Und das ist auch gut so.",kategorie:"dreckig",fuer:"sub",intensitaet:4,tageszeit:"abend"},{id:"fc-d009",text:"Es gibt einen Grund, warum du diese App \xF6ffnest, bevor du deine Mails checkst.",kategorie:"dreckig",fuer:"beide",intensitaet:3,tageszeit:"morgen"},{id:"fc-d010",text:"Sie hat schon entschieden. Du erf\xE4hrst es sp\xE4ter.",kategorie:"dreckig",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-d011",text:"Halt heute Abend nicht so viel aus wie du denkst. Sie wird es merken.",kategorie:"dreckig",fuer:"sub",intensitaet:4,tageszeit:"abend"},{id:"fc-d012",text:"Zwischen K\xFCche und Schlafzimmer liegt heute mehr als ein Flur.",kategorie:"dreckig",fuer:"beide",intensitaet:3,tageszeit:"abend"},{id:"fc-d013",text:"Du hast dich heute Morgen angezogen. Sie plant, das r\xFCckg\xE4ngig zu machen.",kategorie:"dreckig",fuer:"sub",intensitaet:3,tageszeit:"morgen"},{id:"fc-d014",text:"Es ist noch nicht mal Mittag und du denkst schon wieder daran.",kategorie:"dreckig",fuer:"beide",intensitaet:3,tageszeit:"tag"},{id:"fc-d015",text:"Manche Sachen sagt man nicht laut. Man macht sie einfach.",kategorie:"dreckig",fuer:"beide",intensitaet:4,tageszeit:"egal"},{id:"fc-do001",text:"Sie entscheidet heute. Wie immer.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-do002",text:"Du bist gut darin, zu warten. \xDCbe das heute nochmal.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-do003",text:"Erst fragen. Immer erst fragen.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-do004",text:"Sie hat heute Morgen schon an dich gedacht. Du wirst gleich merken, in welchem Zusammenhang.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-do005",text:"Was du heute willst, ist nicht die Frage.",kategorie:"dominant",fuer:"sub",intensitaet:5,tageszeit:"egal"},{id:"fc-do006",text:"Sie merkt es, wenn du nicht ganz bei der Sache bist. Sie merkt alles.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-do007",text:"Es gibt zwei M\xF6glichkeiten heute: ihre und die falsche.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-do008",text:"Du hast heute keine Entscheidungen zu treffen. Entspann dich.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-do009",text:"Sie hat sich etwas \xFCberlegt. Du wirst es rechtzeitig erfahren.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-do010",text:"Gehorsam ist keine Schw\xE4che. Es ist eine Entscheidung, die du jeden Tag neu triffst.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-do011",text:"Heute ist ein guter Tag, um sie stolz zu machen.",kategorie:"dominant",fuer:"sub",intensitaet:3,tageszeit:"morgen"},{id:"fc-do012",text:"Du wirst heute mindestens einmal 'Ja' sagen, wenn du lieber 'Aber' sagen w\xFCrdest.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-do013",text:"Sie hat die Regeln nicht ohne Grund gemacht.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-do014",text:"Was in der Queue steht, bleibt in der Queue. Bis sie es rausholt.",kategorie:"dominant",fuer:"sub",intensitaet:5,tageszeit:"egal"},{id:"fc-do015",text:"Du fragst dich, was heute passiert. Genau das ist der Punkt.",kategorie:"dominant",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-s001",text:"Dienen ist eine Kunst. Du wirst jeden Tag besser.",kategorie:"submissiv",fuer:"sub",intensitaet:3,tageszeit:"morgen"},{id:"fc-s002",text:"Das Beste an Hingabe: Du musst nichts entscheiden.",kategorie:"submissiv",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-s003",text:"Du hast dich f\xFCr das hier entschieden. Erinnere dich heute daran, warum.",kategorie:"submissiv",fuer:"sub",intensitaet:3,tageszeit:"morgen"},{id:"fc-s004",text:"Sie zu bekommen was sie braucht \u2014 das ist dein Job. Und du machst ihn gern.",kategorie:"submissiv",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-s005",text:"Der schwierigste Teil ist nicht das Machen. Es ist das Warten.",kategorie:"submissiv",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-s006",text:"Du bist nicht weniger, weil du kniest. Du bist genau da wo du sein willst.",kategorie:"submissiv",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-s007",text:"Heute: fragen, nicht nehmen.",kategorie:"submissiv",fuer:"sub",intensitaet:3,tageszeit:"morgen"},{id:"fc-s008",text:"Ein 'Danke' zur richtigen Zeit ist mehr wert als tausend Worte.",kategorie:"submissiv",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-s009",text:"Sie merkt sich, wie du dich verh\xE4ltst, wenn du denkst dass es niemand sieht.",kategorie:"submissiv",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-s010",text:"Kontrolle abgeben ist nicht Kontrollverlust. Es ist Vertrauen.",kategorie:"submissiv",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-t001",text:"Nicht heute. Vielleicht morgen. Vielleicht auch nicht.",kategorie:"teasing",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-t002",text:"Es steht schon fest. Du erf\xE4hrst es nur noch nicht.",kategorie:"teasing",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-t003",text:"Du wirst heute mindestens dreimal denken 'jetzt gleich' \u2014 und dich zweimal irren.",kategorie:"teasing",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-t004",text:"Warten macht alles besser. Sagt sie zumindest.",kategorie:"teasing",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-t005",text:"Wenn du glaubst, du wei\xDFt was heute passiert, liegst du falsch.",kategorie:"teasing",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-t006",text:"Heute wird angefangen. Ob auch aufgeh\xF6rt wird, ist eine andere Frage.",kategorie:"teasing",fuer:"sub",intensitaet:4,tageszeit:"abend"},{id:"fc-t007",text:"Etwas ist geplant. Mehr sagt sie nicht.",kategorie:"teasing",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-t008",text:"Du bist nerv\xF6s. Das ist beabsichtigt.",kategorie:"teasing",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-t009",text:"Kurz davor ist auch ein Ort, an dem man l\xE4nger bleiben kann.",kategorie:"teasing",fuer:"sub",intensitaet:5,tageszeit:"egal"},{id:"fc-t010",text:"Sie hat heute Morgen gel\xE4chelt, als sie an heute Abend gedacht hat. Viel Spa\xDF beim R\xE4tseln.",kategorie:"teasing",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-t011",text:"Frag ruhig. Die Antwort wird dir nicht gefallen.",kategorie:"teasing",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-t012",text:"Manchmal ist das Beste am Abend, dass er noch nicht angefangen hat.",kategorie:"teasing",fuer:"beide",intensitaet:3,tageszeit:"tag"},{id:"fc-w001",text:"Egal was heute l\xE4uft: Am Ende des Tages sind wir zwei.",kategorie:"warm",fuer:"beide",intensitaet:1,tageszeit:"morgen"},{id:"fc-w002",text:"Frag sie heute, wie es ihr wirklich geht. Und h\xF6r dann zu.",kategorie:"warm",fuer:"sub",intensitaet:1,tageszeit:"abend"},{id:"fc-w003",text:"N\xE4he ist nicht nur das Laute. Manchmal reicht eine Hand.",kategorie:"warm",fuer:"beide",intensitaet:1,tageszeit:"egal"},{id:"fc-w004",text:"Wir m\xFCssen heute nichts beweisen. Auch das ist erlaubt.",kategorie:"warm",fuer:"beide",intensitaet:1,tageszeit:"egal"},{id:"fc-w005",text:"Die stillen Abende z\xE4hlen genauso wie die lauten.",kategorie:"warm",fuer:"beide",intensitaet:1,tageszeit:"abend"},{id:"fc-w006",text:"Wenn es heute zu viel wird, sagen wir es. Daf\xFCr haben wir die Worte.",kategorie:"warm",fuer:"beide",intensitaet:1,tageszeit:"egal"},{id:"fc-w007",text:"Vertrauen ist die Basis. Alles andere kommt danach.",kategorie:"warm",fuer:"beide",intensitaet:1,tageszeit:"egal"},{id:"fc-w008",text:"Sag ihr heute einmal Danke. F\xFCr irgendwas. Sie wei\xDF schon wof\xFCr.",kategorie:"warm",fuer:"sub",intensitaet:1,tageszeit:"abend"},{id:"fc-w009",text:"Die Beziehung ist das Fundament. Das Spiel ist nur das sch\xF6ne Zimmer obendrauf.",kategorie:"warm",fuer:"beide",intensitaet:1,tageszeit:"egal"},{id:"fc-w010",text:"Heute darf auch einfach mal alles normal sein.",kategorie:"warm",fuer:"beide",intensitaet:1,tageszeit:"egal"},{id:"fc-f001",text:"Du hast heute schon dreimal aufs Handy geschaut, ob sie geschrieben hat. Wir z\xE4hlen mit.",kategorie:"frech",fuer:"sub",intensitaet:2,tageszeit:"tag"},{id:"fc-f002",text:"Diese App wei\xDF mehr \xFCber uns als unsere Freunde.",kategorie:"frech",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-f003",text:"Erinnerung: Wir haben eine Bucket-List. Wir haben sie seit drei Wochen nicht anger\xFChrt.",kategorie:"frech",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-f004",text:"Der Button funktioniert \xFCbrigens auch tags\xFCber.",kategorie:"frech",fuer:"beide",intensitaet:3,tageszeit:"tag"},{id:"fc-f005",text:"Es gibt Menschen, die benutzen ihr Handy f\xFCr Nachrichten und Kalender. S\xFC\xDF.",kategorie:"frech",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-f006",text:"Falls du dich fragst: Ja, sie hat es gesehen. Nein, sie antwortet noch nicht.",kategorie:"frech",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-f007",text:"Du bist nicht der Erste, der glaubt, er k\xF6nnte durchhalten.",kategorie:"frech",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-f008",text:"Statistisch gesehen wird heute jemand betteln. Wetten, wer?",kategorie:"frech",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-f009",text:"Deine Streak sieht gut aus. W\xE4re schade drum.",kategorie:"frech",fuer:"sub",intensitaet:2,tageszeit:"morgen"},{id:"fc-f010",text:"Es ist noch Platz auf der Wunschliste. Nur so als Hinweis.",kategorie:"frech",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-n001",text:"Was wir machen, funktioniert nur, weil wir beide es wollen. Das ist keine Kleinigkeit.",kategorie:"nachdenklich",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-n002",text:"Grenzen verschieben sich. Sie verschwinden nicht.",kategorie:"nachdenklich",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-n003",text:"Kontrolle geben ist mehr Arbeit als Kontrolle nehmen. Beide wissen das.",kategorie:"nachdenklich",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-n004",text:"Das Spiel funktioniert nur, solange wir auch au\xDFerhalb davon reden.",kategorie:"nachdenklich",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-n005",text:"Es gibt einen Unterschied zwischen 'Ich kann nicht' und 'Ich will gerade nicht'. Beides ist okay.",kategorie:"nachdenklich",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-n006",text:"Wir haben uns das ausgesucht. Und wir k\xF6nnen es jeden Tag neu aussuchen.",kategorie:"nachdenklich",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-n007",text:"Wer f\xFChrt, tr\xE4gt auch die Verantwortung. Das ist der Deal.",kategorie:"nachdenklich",fuer:"domme",intensitaet:2,tageszeit:"egal"},{id:"fc-n008",text:"Das Beste an Regeln: Man kann sie \xE4ndern, wenn sie nicht mehr passen.",kategorie:"nachdenklich",fuer:"beide",intensitaet:2,tageszeit:"egal"},{id:"fc-m001",text:"Fortschritt ist unbequem. Das ist der ganze Punkt.",kategorie:"motivation",fuer:"sub",intensitaet:3,tageszeit:"morgen"},{id:"fc-m002",text:"Vor drei Monaten h\xE4ttest du das nicht geschafft. Denk mal dr\xFCber nach.",kategorie:"motivation",fuer:"sub",intensitaet:3,tageszeit:"morgen"},{id:"fc-m003",text:"Die Zahl steigt. Nicht von allein.",kategorie:"motivation",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-m004",text:"Heute ist ein guter Tag, um dein Limit neu zu definieren.",kategorie:"motivation",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-m005",text:"Ausdauer ist \xDCbungssache. Und du \xFCbst gern.",kategorie:"motivation",fuer:"sub",intensitaet:4,tageszeit:"egal"},{id:"fc-m006",text:"Sie hat das Ziel erh\xF6ht, weil du das alte erreicht hast. Nimm es als Kompliment.",kategorie:"motivation",fuer:"sub",intensitaet:4,tageszeit:"morgen"},{id:"fc-m007",text:"Ein Level ist nur eine Zahl. Aber sie stimmt.",kategorie:"motivation",fuer:"sub",intensitaet:3,tageszeit:"egal"},{id:"fc-m008",text:"Der n\xE4chste Rang ist n\xE4her als du denkst.",kategorie:"motivation",fuer:"sub",intensitaet:3,tageszeit:"morgen"},{id:"fc-x001",text:"Zieh heute eine Karte. Irgendeine. Macht sie.",kategorie:"wildcard",fuer:"beide",intensitaet:3,tageszeit:"egal"},{id:"fc-x002",text:"Dreht heute einmal am Rad. Was rauskommt, wird gemacht.",kategorie:"wildcard",fuer:"beide",intensitaet:4,tageszeit:"abend"},{id:"fc-x003",text:"Heute \xFCbernimmt der Zufall. M\xFCnze werfen: Kopf hei\xDFt ihre Idee, Zahl hei\xDFt seine.",kategorie:"wildcard",fuer:"beide",intensitaet:3,tageszeit:"abend"},{id:"fc-x004",text:"Neue Regel f\xFCr heute. Sie denkt sich eine aus, jetzt sofort.",kategorie:"wildcard",fuer:"domme",intensitaet:4,tageszeit:"morgen"},{id:"fc-x005",text:"Schauen wir uns heute an, was wir vor einem Jahr gemacht haben. Und dann: nochmal.",kategorie:"wildcard",fuer:"beide",intensitaet:3,tageszeit:"abend"},{id:"fc-x006",text:"Ein Punkt geht heute an denjenigen, der zuerst nachgibt.",kategorie:"wildcard",fuer:"beide",intensitaet:3,tageszeit:"egal"},{id:"fc-x007",text:"Heute keine Regeln. Ausnahmsweise. Nutzt es.",kategorie:"wildcard",fuer:"beide",intensitaet:3,tageszeit:"morgen"},{id:"fc-x008",text:"Der erste von uns, der heute den Button dr\xFCckt, darf sich etwas w\xFCnschen.",kategorie:"wildcard",fuer:"beide",intensitaet:3,tageszeit:"morgen"},{id:"fc-g001",text:"Er wartet. Ob du ihn warten l\xE4sst, ist deine Entscheidung.",kategorie:"dominant",fuer:"domme",intensitaet:4,tageszeit:"egal"},{id:"fc-g002",text:"Du hast heute die Wahl zwischen nett und interessant.",kategorie:"teasing",fuer:"domme",intensitaet:4,tageszeit:"morgen"},{id:"fc-g003",text:"Er hat sich in letzter Zeit angestrengt. Vielleicht merkt er es, wenn du es merkst.",kategorie:"warm",fuer:"domme",intensitaet:2,tageszeit:"egal"},{id:"fc-g004",text:"Die Queue hat noch Platz.",kategorie:"dominant",fuer:"domme",intensitaet:4,tageszeit:"egal"},{id:"fc-g005",text:"Manchmal ist die st\xE4rkste Ansage die, die man nicht ausspricht.",kategorie:"dominant",fuer:"domme",intensitaet:4,tageszeit:"egal"},{id:"fc-g006",text:"Du wei\xDFt genau, was er heute braucht. Ob er es bekommt, ist eine andere Sache.",kategorie:"teasing",fuer:"domme",intensitaet:4,tageszeit:"egal"},{id:"fc-g007",text:"Heute w\xE4re ein guter Tag, um ihn zu \xFCberraschen. Positiv oder anders \u2014 deine Wahl.",kategorie:"wildcard",fuer:"domme",intensitaet:3,tageszeit:"morgen"},{id:"fc-g008",text:"F\xFChren hei\xDFt auch: merken, wann er an der Grenze ist.",kategorie:"nachdenklich",fuer:"domme",intensitaet:2,tageszeit:"egal"},{id:"fc-g009",text:"Er hat sein Ziel diese Woche geschafft. Was jetzt kommt, entscheidest du.",kategorie:"motivation",fuer:"domme",intensitaet:3,tageszeit:"egal"},{id:"fc-g010",text:"Du musst heute nichts planen. Spontan ist auch eine Ansage.",kategorie:"dominant",fuer:"domme",intensitaet:3,tageszeit:"morgen"}],wup:[{id:"w1-001",text:"Wann hast du zum ersten Mal gedacht, dass aus uns etwas wird?",typ:"wahrheit",stufe:1,intensitaet:1,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["anfang"]},{id:"w1-002",text:"Was war der Moment, in dem du am meisten in mich verliebt warst?",typ:"wahrheit",stufe:1,intensitaet:1,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["gefuehle"]},{id:"w1-003",text:"Was hast du bei unserem ersten Treffen wirklich \xFCber mich gedacht \u2014 die ehrliche Version?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["anfang","ehrlich"]},{id:"w1-004",text:"Welche Angewohnheit von mir findest du insgeheim nervig, hast es aber nie gesagt?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["ehrlich"]},{id:"w1-005",text:"Was ist die kleinste Sache, die ich mache, die dir jedes Mal auff\xE4llt?",typ:"wahrheit",stufe:1,intensitaet:1,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["detail"]},{id:"w1-006",text:"Wann hast du dich das letzte Mal von mir richtig gesehen gef\xFChlt?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["tief"]},{id:"w1-007",text:"Was erz\xE4hlst du anderen \xFCber mich, wenn ich nicht dabei bin?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["aussenwirkung"]},{id:"w1-008",text:"Gibt es einen Streit, der dich mehr besch\xE4ftigt hat, als du damals zugegeben hast?",typ:"wahrheit",stufe:1,intensitaet:3,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["konflikt"]},{id:"w1-009",text:"Welche gemeinsame Erinnerung holst du hervor, wenn du dich schlecht f\xFChlst?",typ:"wahrheit",stufe:1,intensitaet:1,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["trost"]},{id:"w1-010",text:"Was hast du an mir gelernt, das du vorher \xFCber dich nicht wusstest?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["tief"]},{id:"w1-011",text:"Was w\xE4re dein perfekter gemeinsamer Tag, wenn Geld und Zeit egal w\xE4ren?",typ:"wahrheit",stufe:1,intensitaet:1,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["traum"]},{id:"w1-012",text:"Bei welchem Song denkst du automatisch an mich?",typ:"wahrheit",stufe:1,intensitaet:1,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["musik"]},{id:"w1-013",text:"Was ist das Netteste, das ich je f\xFCr dich getan habe \u2014 und wei\xDF ich, dass es dir so viel bedeutet hat?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["dankbarkeit"]},{id:"w1-014",text:"Wovor hattest du am Anfang unserer Beziehung Angst?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["angst"]},{id:"w1-015",text:"Was war die peinlichste Situation, in die wir uns gemeinsam gebracht haben?",typ:"wahrheit",stufe:1,intensitaet:1,an:"beide",kategorie:"beziehung",dauer_min:null,tags:["lustig"]},{id:"w1-101",text:"Welchen Teil deines eigenen K\xF6rpers magst du am liebsten?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"koerper",dauer_min:null,tags:["selbstbild"]},{id:"w1-102",text:"Was war das Erste, das dir k\xF6rperlich an mir aufgefallen ist?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"koerper",dauer_min:null,tags:["anziehung"]},{id:"w1-103",text:"Welche Stelle an dir wird zu selten beachtet?",typ:"wahrheit",stufe:1,intensitaet:3,an:"beide",kategorie:"koerper",dauer_min:null,tags:["wunsch"]},{id:"w1-104",text:"Wo willst du ber\xFChrt werden, wenn du gestresst bist?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"koerper",dauer_min:null,tags:["beruehrung"]},{id:"w1-105",text:"Was ziehe ich an, das dich sofort auf andere Gedanken bringt?",typ:"wahrheit",stufe:1,intensitaet:3,an:"beide",kategorie:"koerper",dauer_min:null,tags:["kleidung"]},{id:"w1-106",text:"Gibt es eine Stelle an dir, bei der du dich unsicher f\xFChlst \u2014 und was w\xFCrde helfen?",typ:"wahrheit",stufe:1,intensitaet:3,an:"beide",kategorie:"koerper",dauer_min:null,tags:["verletzlich"]},{id:"w1-107",text:"Welcher meiner Ger\xFCche gef\xE4llt dir am besten?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"koerper",dauer_min:null,tags:["sinne"]},{id:"w1-108",text:"Was macht meine Stimme mit dir, wenn ich leise rede?",typ:"wahrheit",stufe:1,intensitaet:3,an:"beide",kategorie:"koerper",dauer_min:null,tags:["stimme"]},{id:"w1-109",text:"Welche Bewegung von mir findest du unwiderstehlich, ohne dass ich es wei\xDF?",typ:"wahrheit",stufe:1,intensitaet:3,an:"beide",kategorie:"koerper",dauer_min:null,tags:["detail"]},{id:"w1-110",text:"Was war dein Gedanke, als du mich das erste Mal nackt gesehen hast?",typ:"wahrheit",stufe:1,intensitaet:3,an:"beide",kategorie:"koerper",dauer_min:null,tags:["erinnerung"]},{id:"w1-201",text:"Was war deine peinlichste Situation beim Sex \u2014 jemals, mit irgendwem?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"lustig",dauer_min:null,tags:["peinlich"]},{id:"w1-202",text:"Was ist das Seltsamste, das du je gegoogelt hast?",typ:"wahrheit",stufe:1,intensitaet:2,an:"beide",kategorie:"lustig",dauer_min:null,tags:["peinlich"]},{id:"w1-203",text:"Wann hast du zuletzt so getan, als h\xE4ttest du etwas verstanden, obwohl du keine Ahnung hattest?",typ:"wahrheit",stufe:1,intensitaet:1,an:"beide",kategorie:"lustig",dauer_min:null,tags:["gestaendnis"]},{id:"w1-204",text:"Welche L\xFCge hast du mir schon mal erz\xE4hlt, die v dass jemand ein Wort sagen muss."},{t:"Der Notausgang",s:"Der kleine Punkt oben rechts, auf jeder Seite. Ein Griff, und alles h\xE4lt an: Der Bildschirm wird ruhig, laufende Uhren stoppen, nichts pocht mehr.",b:"Er liegt \xFCber allem \u2014 auch \xFCber einem Vollbild-Befehl. Genau daf\xFCr ist er da."},{t:"Die Tarnung",s:"Drei schnelle Tipps auf eine freie Stelle \u2014 irgendwo in der App \u2014, und aus EMBER wird eine ganz gew\xF6hnliche Notizen-App. Mit echten Notizen, die man lesen, schreiben und durchsuchen kann. Drei Tipps auf die Notizliste holen alles zur\xFCck.",b:'Jemand setzt sich neben dich? Drei Tipps. Auf dem Bildschirm steht dann \u201EEinkauf: Milch, Kaffee".'}]},{gruppe:"Jeden Tag",bild:"sanduhr",wort:"Was die App von selbst tut \u2014 und was ihr t\xE4glich habt.",eintraege:[{t:"Das Heim",s:"Alles Heutige steht hier untereinander: eine Nachricht, die du hinterlegen kannst, seine und deine Tagesaufgabe, die Frage des Tages, sein M\xFCnzstand, der gro\xDFe Knopf und unten der Gl\xFCckskeks.",e:"Alles, was heute z\xE4hlt, von oben nach unten. Alles antippbar.",bs:'Tipp ganz oben auf \u201EEtwas f\xFCr heute hinterlegen" und leg ein Foto hin \u2014 er sieht es beim ersten \xD6ffnen.',be:"Ganz oben steht, was sie dir hinterlassen hat. Der Rest ist deiner: Aufgabe, Frage, M\xFCnzen, Knopf."},{t:"Die Tagesaufgabe",s:"Jeden Tag zieht die App f\xFCr jeden von euch eine Aufgabe \u2014 gestaffelt nach seiner Stufe. Du siehst seine mit und kannst sie tauschen oder wegnehmen. Erledigtes z\xE4hlt auf die Serie und bringt ihm M\xFCnzen.",e:"Jeden Tag eine Aufgabe, passend zu deiner Stufe. Erledigt melden, sie best\xE4tigt \u2014 dann z\xE4hlt sie f\xFCr deine Serie und deine M\xFCnzen.",b:"Sieben Tage am St\xFCck geschafft? Die App bucht von selbst einen Bonus."},{t:"Die Frage des Tages",s:"Eine ehrliche Frage, jeden Tag eine andere, f\xFCr euch beide dieselbe. Erst wenn beide geantwortet haben, seht ihr die Antwort des anderen.",b:'\u201EWas hat dich heute an mir \xFCberrascht?" \u2014 du schreibst, er schreibt, dann klappt es auf.'},{t:"Der Gl\xFCckskeks",s:"Unten auf dem Heim liegt ein Keks. Einmal am Tag l\xE4sst er sich knacken \u2014 mit Bruch, Kr\xFCmeln und einem Zettel darin. Eigene Spr\xFCche legst du unter Verwaltung \u2192 Anlegen ins Glas.",b:"Leg ihm zehn eigene Zettel hinein \u2014 er wei\xDF nie, ob heute deiner kommt oder einer aus dem Vorrat."},{t:"Der gro\xDFe Knopf",s:"Antippen \xF6ffnet ein Blatt: Worte dazu, eine Frist, dann senden. Gedr\xFCckt halten schickt sofort \u2014 ohne ein Wort, daf\xFCr mit einem Ring, der sich schlie\xDFt. Sein Bildschirm geh\xF6rt dir, sobald es ankommt.",e:'Dein Knopf hei\xDFt \u201EBitte". Du fragst, sie antwortet \u2014 mit Ja, Nein oder \u201EJa, aber \u2026". Wann, entscheidet sie.',bs:"Halten, bis der Ring voll ist: Bei ihm f\xFCllt sich der Bildschirm, ohne dass ein Wort f\xE4llt.",be:"Du darfst immer fragen. Ein Nein ist kein Weltuntergang \u2014 es geh\xF6rt dazu."}]},{gruppe:"Reden",bild:"plausch",wort:"Chat, Sprachnachrichten, Signale, eigene W\xF6rter.",eintraege:[{t:"Der Chat",s:"Verschl\xFCsselt, nur ihr zwei. Text, Fotos, Sprachnachrichten. \xDCber den Sanduhr-Knopf gibst du einer Nachricht ein Ablaufdatum \u2014 dann verschwindet sie von selbst.",b:'Ein Foto mit \u201E1 Stunde" schicken: Danach ist es fort, auf beiden Ger\xE4ten.'},{t:"Sprachnachrichten",s:"Das Mikrofon gedr\xFCckt halten und sprechen. W\xE4hrend der Aufnahme siehst du den Pegel wandern \u2014 man h\xF6rt, dass jemand da ist.",b:"Manches sagt eine Stimme in f\xFCnf Sekunden besser als drei Abs\xE4tze Text."},{t:"Die Schnellwahl",s:"\xDCber dem Schreibfeld liegen kurze Wendungen, die ihr oft braucht. Ein Tipp gen\xFCgt.",b:'\u201Egood boy" ist einen Daumen entfernt \u2014 nicht drei.'},{t:"Signale",s:"Eigene Codew\xF6rter mit fester Bedeutung. Ein Wort im Chat, und beide wissen, was gemeint ist, ohne dass es dasteht.",b:'\u201ELeuchtturm" hei\xDFt bei euch: Ich denke an dich, sag nichts weiter.'},{t:"Unsere W\xF6rter",s:"Euer privates W\xF6rterbuch f\xFCr alles, was nur zwischen euch etwas bedeutet. Jeder darf anlegen und erg\xE4nzen.",b:'\u201EDer Ort" = euer Platz am Fluss. Wer neu dazukommt, versteht kein Wort \u2014 und das ist der Sinn.'}]},{gruppe:"Spielen",bild:"wuerfel",wort:"Karten, R\xE4der, Lose, Quiz, Baukasten, Regie, Timer.",eintraege:[{t:"Die Decks",s:"Kartenstapel zum Ziehen: fertige aus dem Vorrat und eure eigenen. Eine gezogene Karte l\xE4sst sich direkt als Auftrag geben.",e:"Kartenstapel zum Ziehen. Was du annimmst, liegt danach bei deinen Auftr\xE4gen.",b:"Tipp auf ein Fach \u2014 die Karte dreht sich um, und erst dann liest du sie."},{t:"Die R\xE4der",s:"Gl\xFCcksr\xE4der mit euren Feldern. Drehen, das Feld unterm Zeiger gilt. Mehrere R\xE4der hintereinander ergeben zusammen eine Ansage.",b:'Rad eins sagt \u201EMassage", Rad zwei \u201Ezehn Minuten", Rad drei \u201EAugen verbunden".'},{t:"Der Baukasten",s:"Ein W\xFCrfel f\xFCr ganze Szenen: Ort, Stimmung, Handlung und mehr werden kombiniert. Einzelne Teile lassen sich festhalten und der Rest neu w\xFCrfeln.",b:'\u201EBadezimmer \xB7 langsam \xB7 Augenbinde" \u2014 der Ort passt nicht? Nur den neu w\xFCrfeln.'},{t:"Wahrheit oder Pflicht",s:"Drei Stufen, mehrere Modi, gef\xFCttert aus dem Vorrat und euren eigenen Karten. Eigene z\xE4hlen doppelt, weil sie euren Ton treffen.",b:"Stufe 1 ist ein Aufw\xE4rmen, Stufe 3 ist keins mehr."},{t:"Die Lose",s:"Rubbellose zum Freikratzen. Es gibt Seltenheiten von Grau bis Rotgold, Nieten, Gutscheine f\xFCrs Portemonnaie \u2014 und Blindlose: Er rubbelt zuerst, dann schreibst du in sechzig Sekunden, was gilt.",e:"Ein Los pro Tag ist geschenkt. Mit dem Finger freirubbeln \u2014 nicht jedes ist ein Gewinn.",b:"Gutscheine wandern ins Portemonnaie und warten dort, bis du sie einl\xF6st."},{t:"Das Quiz",s:"Beide beantworten dieselben Fragen \u2014 einmal \xFCber sich, einmal ratend \xFCber den anderen. Am Ende zeigt die App, wie gut ihr euch kennt.",b:"Erschreckend oft liegt man beim Lieblingsessen daneben."},{t:"Die Regie",s:'Ein Skript f\xFChrt euch Schritt f\xFCr Schritt durch eine Szene, mit Uhr und Ton beim Wechsel. Du siehst alle Schritte, er bekommt immer nur den n\xE4chsten. Es gibt auch den Modus \u201Enur du siehst die Anweisungen" \u2014 dann sagst du sie an.',e:"Sie startet ein Skript, und das Handy f\xFChrt euch durch den Abend. Du siehst immer nur den n\xE4chsten Schritt.",b:"Zwanzig Minuten, acht Schritte, und niemand muss zwischendurch \xFCberlegen."},{t:"Der Timer",s:"Eine Uhr mit fester oder zuf\xE4lliger Dauer. Der Blind-Timer zeigt die Restzeit nicht \u2014 nur, dass er l\xE4uft.",b:"Zwischen drei und zwanzig Minuten, und keiner wei\xDF, wann es klingelt."}]},{gruppe:"F\xFChren",bild:"kette",wort:"Auftr\xE4ge, Regeln, Strafen, Sperren, Fotos.",nurFuehrend:!0,eintraege:[{t:"Auftr\xE4ge",s:"Was er tun soll \u2014 mit Frist, wenn du willst, und in einem Rhythmus: t\xE4glich, w\xF6chentlich oder einmalig. Er meldet erledigt, du best\xE4tigst. Erst dann z\xE4hlt es.",b:'\u201ESchick mir vor dem Mittag ein Foto deiner H\xE4nde." Frist 12 Uhr, einmalig.'},{t:"Regeln",s:'Was dauerhaft gilt, bis du es wegnimmst. \xC4nderst du eine, bekommt er nur \u201EEtwas hat sich ge\xE4ndert" \u2014 nachsehen muss er selbst.',b:'\u201EDu fragst, bevor du das Haus verl\xE4sst." Steht, bis du sie streichst.'},{t:"Ausstehendes",s:"Strafen, die warten. Er sieht nur die Anzahl, nie den Inhalt. Du \xF6ffnest einzeln, wann du magst.",b:"Drei offene Punkte auf seinem Bildschirm sind manchmal wirksamer als drei ausgesprochene S\xE4tze."},{t:"Die Sperre",s:"Nichts ohne deine Erlaubnis. Auf beiden Heim-Seiten steht ein Siegel mit laufender Zeit. Er kann bitten \u2014 du gew\xE4hrst, lehnst ab, oder lehnst ab und verl\xE4ngerst.",b:"Ablehnen und um zwei Tage verl\xE4ngern: Die App macht das in einem Zug."},{t:"Der Foto-Auftrag",s:"Ein Auftrag mit laufender Uhr auf seinem Heim. Kommt nichts, wandert er von selbst ins Ausstehende.",b:"Drei\xDFig Minuten, und die Uhr tickt sichtbar. Das reicht meistens."}]},{gruppe:"Wachsen",bild:"pfeilauf",wort:"Stufen, Werte, Auszeichnungen, Pfade, Bosse.",eintraege:[{t:"Stufen und Punkte",s:"Alles Erledigte zahlt automatisch ein. Aus Punkten werden Stufen, aus Stufen R\xE4nge. Sechs Werte zeigen, wo er stark ist und wo nicht.",e:"Alles, was du erledigst, zahlt hier von selbst ein. Deine Stufe steigt, deine sechs Werte wachsen unterschiedlich schnell.",b:"Eine neue Stufe bringt ein Siegel \u2014 die seltene W\xE4hrung f\xFCr die gro\xDFen Dinge."},{t:"Auszeichnungen",s:"Du legst sie an und verleihst sie, wann du willst. Kein Automatismus \u2014 genau das macht sie wertvoll.",e:"Was sie dir verliehen hat, steht hier. F\xFCr immer.",b:'\u201EF\xFCr die Nacht im Regen" \u2014 eine Zeile, die in zehn Jahren noch etwas bedeutet.'},{t:"Pfade",s:"Ein Stufenplan, den du baust. Er sieht immer nur die n\xE4chste Stufe, nie das Ziel. Stufen d\xFCrfen verborgen bleiben, bis sie erreicht sind.",e:"Stufenpl\xE4ne, die sie gebaut hat. Du siehst die n\xE4chste Stufe \u2014 mehr nicht.",b:'Pfad \u201EGeduld", f\xFCnf Stufen. Die f\xFCnfte kennt nur sie.'},{t:"Bosse",s:"Eine gr\xF6\xDFere Pr\xFCfung mit Belohnung. Anlegen, ank\xFCndigen, gemeinsam bestehen.",b:"Eine Woche ohne, dann der Boss. Wer ihn besiegt, bekommt ein Siegel."}]},{gruppe:"Der Laden",bild:"muenze",wort:"M\xFCnzen verdienen und ausgeben, Preise, Bu\xDFgelder, Abos.",nurMitLaden:!0,eintraege:[{t:"M\xFCnzen und Siegel",s:"M\xFCnzen (\u25CF) verdient er mit Aufgaben und Auftr\xE4gen, dazu kommt sonntags um 20 Uhr sein Gehalt. Siegel (\u2726) gibt es nur f\xFCr Meilensteine und nie zu kaufen.",e:'M\xFCnzen (\u25CF) verdienst du mit allem, was du erledigst; sonntags um 20 Uhr kommt dein Gehalt. Siegel (\u2726) gibt es nur f\xFCr gro\xDFe Schritte \u2014 und nur die zahlen \u201EDas Gro\xDFe".',b:"Ein Siegel l\xE4sst sich in f\xFCnfzig M\xFCnzen einschmelzen. Der Weg zur\xFCck existiert nicht."},{t:"Kaufen und Einl\xF6sen",s:"Ein Kauf verschwindet nicht: Er liegt als offener Kauf bei ihm, bis er ihn dir vorlegt. Den Moment w\xE4hlst du.",e:"Gekauftes liegt erst bei dir. Zum Einl\xF6sen legst du es ihr vor \u2014 wann es gilt, entscheidet sie.",b:'Er kauft \u201EZehn Minuten Kuscheln" f\xFCr 3 \u25CF und legt es abends vor. Du sagst: jetzt.'},{t:"Deine Hebel",s:"Unten im Laden: geben und nehmen, Bu\xDFgeld aus dem Katalog, Sonderabgabe ohne Begr\xFCndung, Gehalt einstellen, M\xFCnzen versiegeln (er sieht sie, erreicht sie nicht) \u2014 und den Laden schlie\xDFen.",e:"Sie stellt Gehalt und Preise ein, verh\xE4ngt Bu\xDFgelder, kann M\xFCnzen versiegeln. Der Katalog zeigt dir jeden Preis im Voraus.",bs:"Halt einen Artikel gedr\xFCckt: Preis \xE4ndern, ausverkauft stellen oder ein 24-Stunden-Angebot starten.",be:"Halt einen Artikel gedr\xFCckt, um darauf zu sparen \u2014 der Balken auf dem Heim geh\xF6rt dann diesem Ziel."},{t:"Was von selbst l\xE4uft",s:"Sonntags 20 Uhr Gehalt, auf Schulden zehn Prozent Zinsen. Am Monatsersten f\xFCnf Prozent Schwund auf ungenutzte M\xFCnzen ab zwanzig \u2014 Erspartes ist sicher \u2014 und die Abo-Abbuchung. Unbezahlbares wird wortlos gek\xFCndigt.",b:"Bei Rot rechnet die App gar nichts: keine Bu\xDFgelder, keine Zinsen. Nie."},{t:"Abos und Schwarzmarkt",s:'Abos sind Dauer-Freiheiten gegen monatliche M\xFCnzen; du schaltest frei und k\xFCndigst. \xDCber \u201ELeise fragen" kann er nach etwas fragen, das es im Laden nicht gibt \u2014 du nennst einen Preis. Oder nicht.',e:'Fang mit h\xF6chstens zwei Abos an. Und wenn du etwas willst, das es nicht gibt: \u201ELeise fragen".',b:"Der Laden ist abschaltbar (Verwaltung \u2192 Bausteine). Alle St\xE4nde bleiben liegen."}]},{gruppe:"N\xE4he",bild:"herz",wort:"W\xFCnsche, Grenzen, K\xF6rper, Vertrag, Danach, Reparatur.",eintraege:[{t:"W\xFCnsche",s:"Jeder tr\xE4gt f\xFCr sich ein, was er sich w\xFCnscht. Sichtbar wird nur, was BEIDE eingetragen haben \u2014 der Rest bleibt geheim, auch voreinander.",b:"Keiner muss sich als Erster offenbaren. Genau das ist der Trick."},{t:"Grenzen",s:"Was geht, was nicht, was vielleicht. \xC4nderungen bleiben als Verlauf sichtbar \u2014 man sieht, wie sich etwas entwickelt hat.",b:'\u201EFotos: vielleicht \u2014 nur ohne Gesicht." Steht da, ohne dass es jemand aussprechen muss.'},{t:"Die K\xF6rperkarte",s:"Sechzehn Zonen, vier Stufen: Liebe ich, mag ich, neutral, bitte nicht. Jeder pflegt seine eigene und sieht die des anderen.",b:'Nacken auf \u201ELiebe ich", F\xFC\xDFe auf \u201EBitte nicht" \u2014 und ihr m\xFCsst nie wieder raten.'},{t:"Der Vertrag",s:"Eure Abmachung, schwarz auf wei\xDF, von beiden mit dem Finger unterschrieben. \xC4ndern geht jederzeit \u2014 dann wird neu unterschrieben, und die alte Fassung bleibt lesbar.",b:"Zwei Unterschriften, und die App macht ein kleines Fest daraus."},{t:"Danach",s:"Nach einer Session schreibt jeder f\xFCr sich, wie es war. Erst wenn beide fertig sind, klappt die App beides auf \u2014 so f\xE4rbt keiner den anderen.",b:"Die ehrlichste Minute des Abends, und sie kostet nichts."},{t:"Reparatur",s:"Nach einem Streit: drei ruhige Schritte, die beide nacheinander freigeben m\xFCssen. Keine Punkte, keine Strafen, kein Spiel.",b:"Hier z\xE4hlt nichts und wird nichts berechnet. Es geht nur um euch."}]},{gruppe:"Spannung",bild:"funke",wort:"Uhren, Verborgenes, Kr\xFCmel, Impulse, Wenn\u2014Dann.",eintraege:[{t:"Countdown und Verborgenes",s:"Eine Uhr, die er ablaufen sieht, ohne zu wissen, worauf. Oder etwas Verborgenes mit Enth\xFCllungsdatum.",e:"Manchmal siehst du nur, DASS etwas kommt. Das ist Absicht.",b:"Freitag 20 Uhr, Inhalt verborgen. Die Vorfreude macht die halbe Arbeit."},{t:"Kr\xFCmel",s:"Kleine Hinweise, die sich \xFCber den Tag verteilen und zu ihren Zeiten auftauchen.",b:"Drei Kr\xFCmel morgens gestreut \u2014 einer taucht um elf auf, einer um drei, einer abends."},{t:"Impulse",s:"Ein Topf, aus dem die App zu zuf\xE4lligen Zeiten etwas zieht. Du f\xFCllst ihn, den Rest macht der Zufall.",b:"Weder du noch er wisst, wann der n\xE4chste kommt."},{t:"Wenn \u2014 Dann",s:"Regeln, die von selbst feuern: WENN etwas passiert, DANN tut die App etwas. Auch wenn ihr gerade gar nicht in der App seid.",e:"Regeln, die sie gebaut hat und die von selbst greifen. Ob welche laufen, siehst du hier.",b:"WENN er die Tagesaufgabe verpasst, DANN kostet es abends 2 \u25CF \u2014 jedes Mal, ohne Diskussion."}]},{gruppe:"Sammeln und Erinnern",bild:"brief",wort:"Buch, Tresor, Regal, Rituale, private Notizen.",eintraege:[{t:"Das Buch",s:"Euer gemeinsames Tagebuch mit Flammen als Bewertung. Oben die W\xE4rmekarte: ein Feld je Tag, je hei\xDFer desto heller \u2014 eure Geschichte auf einen Blick.",b:"Drei Zeilen nach dem Abend reichen. In einem Jahr sind sie unbezahlbar."},{t:"Der Tresor",s:"Dein Bilder-Safe. Du l\xE4dst hoch und gibst einzeln frei, was er sehen darf \u2014 und nimmst es genauso wieder zur\xFCck.",e:"Was sie f\xFCr dich freigegeben hat. Was du hier siehst, hat sie bewusst ge\xF6ffnet.",b:"Freigeben hei\xDFt nicht verschenken. Zur\xFCcknehmen geht jederzeit."},{t:"Das Regal",s:"Was an Spielzeug wirklich da ist. Die Decks und der Baukasten richten sich danach \u2014 was fehlt, wird nie vorgeschlagen.",b:"Ohne Augenbinde im Regal taucht auch keine Karte damit auf."},{t:"Rituale",s:"Was regelm\xE4\xDFig wiederkehrt, mit Serie f\xFCrs Dranbleiben. Daneben Countdowns auf besondere Tage.",b:'\u201EGuten-Morgen-Nachricht vor 9 Uhr" \u2014 und die Serie z\xE4hlt stolz mit.'},{t:"Nur f\xFCr dich",s:"Private Notizen, die dieses Ger\xE4t nie verlassen. Nicht in der Ablage, nirgends \u2014 auch der andere kann sie nicht lesen.",b:"F\xFCr Gedanken, die noch reifen m\xFCssen. Oder f\xFCr immer bleiben, wo sie sind."}]},{gruppe:"Einstellen",bild:"schloss",wort:"Modus, Bausteine, Aussehen, Sicherheit, R\xE4ume.",eintraege:[{t:"Wie ihr spielt",s:'Drei Weisen: \u201ESie f\xFChrt", \u201EAuf Augenh\xF6he" (niemand f\xFChrt, beide haben denselben Knopf) und \u201EEr f\xFChrt". Wechseln geht nur, wenn beide zustimmen \u2014 einer schl\xE4gt vor, der andere best\xE4tigt auf dem eigenen Ger\xE4t.',b:"Ihr \u2192 Einstellungen \u2192 Wie ihr spielt. Nichts geht dabei verloren: Alles Angelegte bleibt liegen."},{t:"Die Bausteine",s:"Ganze Bereiche einzeln an- und ausschalten: Laden, Tagesaufgaben, Frage des Tages, Gl\xFCckskeks, Wenn\u2014Dann. Abschalten hei\xDFt ruhen \u2014 alle St\xE4nde bleiben, wo sie sind.",e:"Was die App anbietet, entscheidet sie unter Verwaltung \u2192 Bausteine.",b:"Zu viel auf einmal? Schalte drei Bausteine aus und in zwei Wochen wieder an."},{t:"Der Vorrat",s:"Hunderte fertige Karten, R\xE4der, Szenarien und Skripte \u2014 mit einer Obergrenze f\xFCr die Intensit\xE4t, die du setzt. Was dar\xFCber liegt, existiert f\xFCr die App schlicht nicht.",b:"Obergrenze 3 einstellen: Alles H\xE4rtere taucht nirgendwo mehr auf."},{t:"Aussehen",s:"F\xFCnf Farbwelten (Glut, Ros\xE9, Gold, Jade, Mitternacht), ein w\xE4hlbares App-Symbol \u2014 auch harmlose, die nach Notizen, Rechner oder Wetter aussehen \u2014 und die Nachtabsenkung, die die App abends w\xE4rmer und dunkler macht.",b:"iOS friert das Symbol beim Hinzuf\xFCgen ein: einmal vom Home-Bildschirm nehmen und neu hinzuf\xFCgen."},{t:"Sicherheit",s:"Eine PIN sperrt die App (dann liegt der Schl\xFCssel nur verschlossen auf dem Ger\xE4t), eine Schlie\xDFzeit sperrt sie nach Pausen von selbst, und die Tarnung verwandelt sie in Notizen.",b:"Ohne PIN kann jeder, der dein Handy in die Hand bekommt, alles lesen. Mit PIN niemand."},{t:"R\xE4ume",s:"Ein Raum ist eine eigene Welt: eigener Schl\xFCssel, eigene Ablage, eigene PIN. Zum Proben \u2014 oder f\xFCr euch.",b:'Der Proberaum bleibt Probe. Ins \u201EWir" geh\xF6rt nur, was wirklich euch geh\xF6rt.'},{t:"Hinweise",s:"Damit etwas ankommt, w\xE4hrend die App zu ist, braucht es zwei Dinge: Die App muss auf dem Home-Bildschirm liegen (nicht im Browser laufen), und die Hinweise m\xFCssen erlaubt sein.",b:"Ich \u2192 Hinweise \u2192 einschalten. Ohne das bleibt es still."}]}],FAQ=[{gruppe:"Erste Fragen",fragen:[{f:"Sieht das jemand au\xDFer uns?",a:"Nein. Alles, was ihr schreibt, wird auf eurem Ger\xE4t verschl\xFCsselt und erst dann gespeichert. Wer die Datenbank \xF6ffnete, s\xE4he Buchstabensalat. Der Schl\xFCssel liegt nur auf euren beiden Ger\xE4ten \u2014 nirgendwo sonst, auch nicht bei mir."},{f:"Was, wenn ich mein Handy verliere?",a:"Mit PIN: Wer es findet, sieht nichts. Ohne PIN sieht er alles \u2014 deshalb lohnt die PIN. Deine Inhalte sind nicht weg: Sie liegen in eurer gemeinsamen Ablage, und ein neues Ger\xE4t kommt mit dem Kopplungscode wieder hinein."},{f:"Warum kommen keine Hinweise an?",a:"Fast immer einer von zwei Gr\xFCnden: Die App l\xE4uft im Browser statt vom Home-Bildschirm (iOS erlaubt Hinweise nur der installierten App), oder die Erlaubnis fehlt. Beides regelt sich unter Ich \u2192 Hinweise."},{f:"Muss ich alles benutzen?",a:"Auf keinen Fall. Fangt mit dem Chat, dem Knopf und der Tagesaufgabe an. Alles andere kann unter Verwaltung \u2192 Bausteine ruhen, bis ihr Lust darauf habt."},{f:"Kostet das etwas?",a:"Nein. Die App geh\xF6rt euch, l\xE4uft auf euren Ger\xE4ten und speichert in eurer eigenen Ablage. Es gibt keine Konten, keine Werbung, niemanden, der mitliest."}]},{gruppe:"Wenn etwas klemmt",fragen:[{f:"Etwas Geschriebenes ist nicht angekommen.",a:"Die App speichert auch ohne Netz und schickt sp\xE4ter von selbst nach. Wenn ihr weit auseinander wart, hilft es, beide Apps einmal zu \xF6ffnen. Beim n\xE4chsten \xD6ffnen geht die Warteschlange raus."},{f:"Die App sieht pl\xF6tzlich anders aus.",a:"Wahrscheinlich hat sich die Stimmung ge\xE4ndert (abends wird sie w\xE4rmer und dunkler) oder jemand hat die Farbwelt gewechselt. Beides steht unter Ich \u2192 Die App."},{f:"Ich sehe die Notizen-App statt EMBER.",a:"Das ist die Tarnung \u2014 drei schnelle Tipps auf die Notizliste holen alles zur\xFCck. Sie bleibt auch nach einem Neustart aktiv, damit niemand versehentlich enttarnt."},{f:"Etwas h\xE4ngt oder wirkt eingefroren.",a:'Die App einmal schlie\xDFen und neu \xF6ffnen. Hilft das nicht: Ich \u2192 Die App \u2192 Nach einer neuen Fassung sehen. Unter \u201ELetzte Fehler" steht, was schiefging.'},{f:"Wir sehen unterschiedliche Dinge.",a:"Meistens hat ein Ger\xE4t eine \xE4ltere Fassung. Beide aktualisieren (Ich \u2192 Aktualisieren), dann stimmt es wieder. Pr\xFCft auch, ob ihr im selben Raum seid \u2014 der Name steht unter dem EMBER-Schriftzug."}]},{gruppe:"\xDCber uns zwei",fragen:[{f:"Was, wenn Kevin etwas nicht will?",a:"Dann sagt er es \u2014 im Gespr\xE4ch, \xFCber seine Ampel oder \xFCber den Notausgang. Die App nimmt Gelb und Rot ernst: Bei Gelb f\xE4llt das H\xE4rteste weg, bei Rot h\xE4lt alles an, und es wird nie ein Bu\xDFgeld berechnet. Keine Erkl\xE4rung n\xF6tig."},{f:"Was, wenn Gioia gerade keine Lust hat zu f\xFChren?",a:'Dann ruht es. Es gibt keine Pflicht, den Knopf zu dr\xFCcken, keinen Z\xE4hler, der sie erinnert. Wenn es l\xE4nger nicht passt, gibt es \u201EAuf Augenh\xF6he" \u2014 dort f\xFChrt niemand, und alles Angelegte bleibt f\xFCr sp\xE4ter liegen.'},{f:"Kann einer den Modus heimlich umstellen?",a:"Nein. Ein Wechsel muss vorgeschlagen und auf dem anderen Ger\xE4t best\xE4tigt werden. Bis dahin \xE4ndert sich gar nichts \u2014 und der Vorschlag ist auf beiden Seiten sichtbar."},{f:"Was passiert bei einem Streit?",a:"Daf\xFCr gibt es die Reparatur (Ich \u2192 F\xFCr uns). Drei ruhige Schritte, die beide freigeben m\xFCssen. Dort z\xE4hlt nichts, wird nichts berechnet und geht keine Serie kaputt."},{f:"Wird das mit der Zeit langweilig?",a:"Dagegen ist einiges eingebaut: Der Vorrat hat mehr Karten, als ihr in Monaten zieht, der Baukasten w\xFCrfelt \xFCber eine Milliarde Kombinationen, und die Pfade und Bosse wachsen mit. Und was langweilig wird, schaltet ihr einfach aus."},{f:"Was, wenn wir aufh\xF6ren wollen?",a:'Dann h\xF6rt ihr auf. \u201EAlles auf Anfang" leert den gemeinsamen Bestand, und
